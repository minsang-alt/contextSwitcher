disabled_rules:
  - trailing_whitespace
  - void_return
  - nesting

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - flatmap_over_map_reduce
  - first_where

excluded:
  - .build
  - .swiftpm
  - DerivedData

line_length:
  warning: 150
  error: 200

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100
