disabled_rules:
  - trailing_whitespace
  - void_return
  - nesting
  - trailing_comma
  - identifier_name
  - cyclomatic_complexity
  - is_disjoint

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - flatmap_over_map_reduce
  - first_where

excluded:
  - .build
  - .swiftpm
  - DerivedData

line_length:
  warning: 160
  error: 250

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100
