name: Bug Report
description: Report a bug in ContextSwitcher
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have read the [README](https://github.com/minsang-alt/contextSwitcher#readme)
          required: true
        - label: I have searched existing issues for duplicates
          required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps to reproduce the issue
      placeholder: |
        1. Open ContextSwitcher
        2. Create a workspace with...
        3. Switch to...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened? Include screenshots or screen recordings if possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ContextSwitcher version
      placeholder: "e.g., 1.2.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g., macOS 15.2 Sequoia"
    validations:
      required: true
