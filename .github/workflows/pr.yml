name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            ci
            test
            style
            perf
          scopes: |
            workspace
            shortcuts
            hud
            menu-bar
            capture
            accessibility
            ui
          requireScope: false
